# .readthedocs.yaml
# ReadTheDocs build configuration — place at repository root
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os:      ubuntu-22.04
  tools:
    python: "3.11"

  # Optional: install system packages for C extension docs
  # apt_packages:
  #   - libssl-dev

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

formats:
  - pdf        # generate downloadable PDF
  - epub       # generate ePub

python:
  install:
    - requirements: docs/requirements.txt
